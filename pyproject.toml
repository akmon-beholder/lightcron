[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightcron"
version = "0.1.0"
description = "Lightweight job orchestration system"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
scheduler = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "alembic>=1.13",
    "pydantic>=2.7",
]
worker = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "psutil>=5.9",
]
dev = [
    "lightcron[scheduler,worker]",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-bdd>=7.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-psutil>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lightcron"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/lightcron"]
omit = ["*/fakes.py"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/lightcron"]

[tool.bandit]
targets = ["src/lightcron"]
skips = ["B101"]
