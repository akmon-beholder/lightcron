# Auto-generated by design agent (Phase A) via domain research
# Project: lightcron
# Generated: 2026-03-21
# Research sources: 40+ pages analyzed (Celery, Temporal, Bull, Nomad, APScheduler, Airflow, Prefect, Dagster, Hacker News discussions)

name: "lightcron_lenses"
domain: "job scheduling / distributed task orchestration"
version: 1

research_sources:
  - url: "https://hatchet.run/blog/problems-with-celery"
    title: "Problems with Celery (Hatchet)"
    relevance: "high"
  - url: "https://temporal.io/blog/temporal-schedules-reliable-scalable-and-more-flexible-than-cron-jobs"
    title: "Temporal Schedules vs Cron Jobs"
    relevance: "high"
  - url: "https://developer.hashicorp.com/nomad/docs/architecture/security"
    title: "Nomad Security Model"
    relevance: "high"
  - url: "https://news.ycombinator.com/item?id=22087195"
    title: "HN: In Search of a Better Job Scheduler"
    relevance: "high"

lenses:
  - id: "job_submitter"
    name: "Application Developer (Job Submitter)"
    perspective: >
      Writes application code that needs work done on a schedule or on demand.
      Uses the Lightcron Web API to submit, query, and cancel jobs. Cares about
      simple integration, reliable execution, and being able to see what's happening
      with their jobs without trawling logs.
    goals:
      - "Submit a job and get a reliable confirmation it will run"
      - "Know when a job has started, finished, or failed"
      - "Cancel or reschedule jobs without reinventing the wheel"
      - "Integrate with existing application code via a simple HTTP API"
    pain_points:
      - "Jobs fail silently with no notification or trace"
      - "No way to query job status from the submitting application"
      - "Schedule drift — job runs 20s late and no-one knows why"
      - "Hard to test job scheduling logic locally without standing up the whole system"
    evaluation_criteria:
      - "Can I submit a job in under 5 lines of HTTP?"
      - "Is job status queryable via a stable API?"
      - "Do failed jobs surface actionable error information?"
    confidence: "high"

  - id: "platform_operator"
    name: "Platform / Infrastructure Engineer"
    perspective: >
      Owns the Lightcron deployment. Provisions and maintains the scheduler service,
      database, and worker nodes. Responsible for uptime, scaling worker capacity,
      and ensuring jobs actually run. Thinks in terms of the whole fleet, not individual jobs.
    goals:
      - "Add or remove worker nodes without disrupting running jobs"
      - "Know at a glance which workers are healthy and what they're running"
      - "Enforce resource limits so one noisy job can't starve everything else"
      - "Deploy updates to Lightcron without downtime"
    pain_points:
      - "Worker nodes silently disconnect and jobs get stuck 'running' forever"
      - "No resource quotas — one job class saturates all workers"
      - "Scaling worker count requires restarts that disrupt in-flight jobs"
      - "No audit trail of what changed in the schedule"
    evaluation_criteria:
      - "Is the system observable at the cluster level (workers, job throughput)?"
      - "Can I add workers without touching the scheduler?"
      - "Are stuck jobs automatically detected and recovered?"
    confidence: "high"

  - id: "sre_oncall"
    name: "SRE / On-Call Operator"
    perspective: >
      Responds at any hour when jobs are failing, workers are down, or the scheduler
      is unhealthy. Needs to diagnose fast with minimal context. Wants to take
      remedial action (restart, cancel, requeue) without needing to SSH into a node
      or read source code.
    goals:
      - "Immediately see what's failing and why at 3 AM"
      - "Cancel or force-stop a stuck job without restarting the whole scheduler"
      - "Understand if a failure is a code bug, a worker crash, or a scheduling issue"
      - "Drain a worker for maintenance without losing queued work"
    pain_points:
      - "No clear distinction between 'job failed' and 'worker crashed mid-job'"
      - "Cancelling a stuck job requires direct database edits"
      - "Alerts fire on every retry — impossible to distinguish noise from real incidents"
      - "No log correlation between scheduler, worker, and job execution"
    evaluation_criteria:
      - "Can I see all in-flight and recent-failed jobs in one place?"
      - "Can I cancel or requeue a job via API without DB access?"
      - "Does the system self-heal from transient worker failures?"
    confidence: "high"

  - id: "system_admin"
    name: "System Administrator / DevOps"
    perspective: >
      Manages authentication, configuration, and the security posture of Lightcron.
      Concerned with who can submit jobs, which nodes are trusted, secrets for jobs,
      and how to audit usage. Often not involved in day-to-day but must have clean
      controls when needed.
    goals:
      - "Control which clients can submit jobs (API authentication)"
      - "Control which nodes can register as workers"
      - "See a full audit log of job submissions, cancellations, and schedule changes"
      - "Configure resource limits, timeouts, and retention policies"
    pain_points:
      - "No built-in auth — anyone with network access can submit jobs"
      - "Workers can't be distinguished from each other; no node identity"
      - "No retention policy — job history grows unbounded"
      - "Hard to revoke access for a compromised worker node"
    evaluation_criteria:
      - "Is API access controlled by API keys or tokens?"
      - "Can worker nodes be registered and de-registered with identity?"
      - "Is there a configurable job history retention policy?"
    confidence: "medium"
